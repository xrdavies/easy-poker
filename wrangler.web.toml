# Frontend Worker: static UI only. Game API is wrangler.toml.
name = "easy-poker"
main = "src/web.ts"
compatibility_date = "2025-09-11"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
# Local default (API wrangler.dev port). Production infers https://easy-poker-api.<account>.workers.dev
# when the page is not localhost. Override for a custom API domain:
#   npx wrangler deploy --config wrangler.web.toml --var API_ORIGIN:https://api.example.com
API_ORIGIN = "http://127.0.0.1:8789"
