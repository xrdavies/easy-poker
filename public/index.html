<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#071018" />
    <title>Easy Poker</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>" />
  </head>
  <body>
    <div id="app">
      <section id="gate" class="screen">
        <div class="gate-card">
          <div class="brand">
            <div class="suit-row" aria-hidden="true"><span>♠</span><span class="red">♥</span><span>♣</span><span class="red">♦</span></div>
            <h1>Easy Poker</h1>
            <p>Texas Hold’em · up to 8 players</p>
          </div>
          <label class="field">
            <span>昵称</span>
            <div class="row">
              <input id="nickname" maxlength="16" placeholder="给自己取个名字" autocomplete="nickname" />
              <button type="button" id="random-name" class="ghost">随机名</button>
            </div>
          </label>
          <div class="tabs">
            <button type="button" class="tab on" data-tab="create">创建游戏桌</button>
            <button type="button" class="tab" data-tab="join">加入游戏桌</button>
          </div>
          <form id="create-form" class="panel">
            <label class="field">
              <span>游戏时长</span>
              <select id="duration">
                <option value="30">30 分钟</option>
                <option value="60">1 小时</option>
                <option value="120">2 小时</option>
                <option value="240">4 小时</option>
                <option value="480">8 小时</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="unlimited" /> 无限 buy-in</label>
            <label class="field" id="max-buyin-field">
              <span>最大 buy-in 次数</span>
              <input id="max-buyins" type="number" min="1" max="99" value="10" />
            </label>
            <label class="check"><input type="checkbox" id="straddle" /> 允许 Straddle（默认关）</label>
            <label class="check"><input type="checkbox" id="short-deck" /> 短牌（6 到 A，同花大于葫芦）</label>
            <label class="check"><input type="checkbox" id="squid" /> 鱿鱼游戏（默认关）</label>
            <label class="check"><input type="checkbox" id="bounty" checked /> 27 杂色奖励（翻牌后逼退对手将自动亮牌，每人支付 5BB）</label>
            <button type="submit" class="primary">创建并进入</button>
          </form>
          <form id="join-form" class="panel hidden">
            <label class="field">
              <span>游戏桌号码</span>
              <input id="join-number" maxlength="8" placeholder="六位号码" class="mono" />
            </label>
            <label class="field">
              <span>密码</span>
              <input id="join-password" maxlength="8" placeholder="四位密码" class="mono" />
            </label>
            <button type="submit" class="primary">加入游戏桌</button>
          </form>
        </div>
      </section>

      <section id="table-screen" class="screen hidden">
        <header class="topbar">
          <div class="top-left">
            <strong class="logo">Easy Poker</strong>
            <span id="table-id" class="mono"></span>
            <button type="button" id="btn-copy-link" class="ghost sm icon-btn">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
              邀请链接
            </button>
          </div>
          <div class="top-right">
            <button type="button" id="btn-ai" class="ghost sm icon-btn desktop-only hidden">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="7" width="14" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v4M8.5 12h.01M15.5 12h.01M9 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <span id="btn-ai-label">AI玩家</span>
            </button>
            <button type="button" id="btn-sit" class="primary sm">坐下</button>
            <button type="button" id="btn-rebuy-top" class="ghost sm icon-btn hidden">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
              补码
            </button>
            <button type="button" id="btn-stand" class="ghost sm icon-btn hidden">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="5" r="2.4" fill="currentColor"/><path d="M9.2 9.2h5.6L16 21h-2.2l-.6-7h-2.4l-.6 7H8.2L9.2 9.2z" fill="currentColor"/></svg>
              起身
            </button>
            <button type="button" id="btn-leave" class="ghost sm icon-btn">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M9 6H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 12h10m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              退出
            </button>
          </div>
        </header>
        <div class="table-wrap">
          <div class="rail">
            <div class="felt" id="felt">
              <div id="seats" class="seats"></div>
              <div class="center-stack">
                <div id="street-label" class="street"></div>
                <div id="pot" class="pot">底池 0</div>
                <div id="board" class="board"></div>
                <div id="banner" class="banner"></div>
                <div id="countdown" class="countdown"></div>
              </div>
              <div id="table-rules" class="table-rules">
                <span id="table-remain"></span>
                <span id="table-rule-flags"></span>
              </div>
            </div>
          </div>
        </div>
        <footer class="dock">
          <div class="hole" id="hole"></div>
          <div class="actions" id="actions"></div>
        </footer>
        <div id="showdown" class="showdown hidden">
          <div class="sd-panel">
            <div class="sd-kicker" id="sd-kicker">本手结算</div>
            <div id="sd-board" class="board"></div>
            <div id="sd-players" class="sd-players"></div>
            <div id="sd-win" class="sd-win"></div>
          </div>
        </div>
      </section>

      <section id="settle-screen" class="screen hidden">
        <div class="gate-card settle">
          <h2>游戏桌已结束</h2>
          <p class="muted">该桌不能重新开启，以下为结算</p>
          <div id="settle-table"></div>
          <div class="row">
            <button type="button" id="btn-copy-link-2" class="ghost">复制邀请链接</button>
            <button type="button" id="btn-leave-2" class="primary">退出游戏桌</button>
          </div>
        </div>
      </section>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <h3>补充筹码</h3>
        <label class="field">
          <span>买入次数</span>
          <input id="buyin-n" type="number" min="1" value="1" />
        </label>
        <p id="buyin-hint" class="muted"></p>
        <div class="row modal-actions">
          <button type="button" id="buyin-cancel" class="ghost">取消</button>
          <button type="button" id="buyin-ok" class="primary">坐下</button>
        </div>
      </div>
    </div>
    <div id="ai-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="ai-modal-title">
      <div class="modal-card ai-modal-card">
        <div class="ai-modal-head">
          <h3 id="ai-modal-title">AI玩家</h3>
          <button type="button" id="ai-close" class="ghost sm" aria-label="关闭">×</button>
        </div>

        <section id="ai-list-view">
          <div id="ai-list" class="ai-list"></div>
          <div class="ai-footer-actions">
            <button type="button" id="ai-add-open" class="primary">添加 AI</button>
            <button type="button" id="ai-profiles-open" class="ghost">管理模型配置</button>
          </div>
        </section>

        <form id="ai-bot-form" class="hidden">
          <label class="field"><span>AI 昵称</span><input id="ai-nickname" maxlength="16" required placeholder="例如 AI-小王" /></label>
          <label class="field"><span>水平</span><select id="ai-level"><option value="beginner">beginner</option><option value="experienced" selected>experienced</option><option value="pro">pro</option></select></label>
          <label class="field"><span>模型配置</span><select id="ai-profile" required></select></label>
          <label class="field"><span>买入次数</span><input id="ai-buyins" type="number" min="1" value="1" required /></label>
          <div class="ai-footer-actions"><button type="submit" class="primary">添加并坐下</button><button type="button" class="ghost" data-ai-back>返回</button></div>
        </form>

        <section id="ai-profiles-view" class="hidden">
          <div id="ai-profile-list" class="ai-list"></div>
          <div class="ai-footer-actions"><button type="button" id="ai-profile-new" class="primary">添加模型配置</button><button type="button" class="ghost" data-ai-back>返回</button></div>
        </section>

        <form id="ai-profile-form" class="hidden">
          <input id="ai-profile-id" type="hidden" />
          <label class="field"><span>配置名称</span><input id="ai-profile-name" maxlength="24" required placeholder="例如 DeepSeek" /></label>
          <label class="field"><span>API Key</span><input id="ai-api-key" type="password" autocomplete="off" placeholder="编辑时留空表示不修改" /></label>
          <label class="field"><span>Base URL</span><input id="ai-base-url" type="url" required placeholder="https://api.example.com/v1" /></label>
          <label class="field"><span>Model</span><input id="ai-model" required placeholder="例如 deepseek-chat" /></label>
          <p class="muted ai-storage-note">API Key 加密保存在当前浏览器，不会发送给游戏服务器。</p>
          <div class="ai-footer-actions"><button type="submit" class="primary">保存配置</button><button type="button" id="ai-profile-cancel" class="ghost">返回</button></div>
        </form>
      </div>
    </div>
    <div id="emote-picker" class="emote-picker hidden" role="group" aria-label="选择表情"></div>
    <div id="toast" class="toast hidden"></div>

    <audio id="sfx-fold" src="/sounds/fold.m4a" preload="auto"></audio>
    <audio id="sfx-check" src="/sounds/check.m4a" preload="auto"></audio>
    <audio id="sfx-bet-1" src="/sounds/bet-1.m4a" preload="auto"></audio>
    <audio id="sfx-bet-2" src="/sounds/bet-2.m4a" preload="auto"></audio>
    <audio id="sfx-bet-3" src="/sounds/bet-3.m4a" preload="auto"></audio>
    <audio id="sfx-allin" src="/sounds/allin.m4a" preload="auto"></audio>
    <audio id="sfx-deal" src="/sounds/deal.m4a" preload="auto"></audio>
    <audio id="sfx-shuffle-1" src="/sounds/shuffle-1.m4a" preload="auto"></audio>
    <audio id="sfx-shuffle-2" src="/sounds/shuffle-2.m4a" preload="auto"></audio>
    <audio id="sfx-shuffle-3" src="/sounds/shuffle-3.m4a" preload="auto"></audio>
    <audio id="sfx-shuffle-4" src="/sounds/shuffle-4.m4a" preload="auto"></audio>
    <audio id="sfx-shuffle-5" src="/sounds/shuffle-5.m4a" preload="auto"></audio>
    <audio id="sfx-tick" src="/sounds/tick.m4a" preload="auto"></audio>
    <audio id="sfx-win" src="/sounds/win.m4a" preload="auto"></audio>
    <audio id="sfx-lose" src="/sounds/lose.m4a" preload="auto"></audio>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
